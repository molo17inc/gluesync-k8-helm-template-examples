apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik
  namespace: gluesync-dev
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: "20.8.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
    service:
      type: NodePort
      nodePorts:
        websecure: 9443
    ports:
      websecure:
        port: 9443
        expose: true
        exposedPort: 9443
        protocol: HTTPS
      web:
        port: 80
        expose: true
        exposedPort: 80
        protocol: HTTP
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesCRD:
        enabled: true
