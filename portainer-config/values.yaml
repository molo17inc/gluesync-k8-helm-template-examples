# Portainer Community Edition Helm Chart values
# Reference: https://docs.portainer.io/start/install-ce/server/kubernetes/helm

# ServiceAccount configuration
serviceAccount:
  name: portainer-sa-clusteradmin

# Service configuration
service:
  type: NodePort
  nodePort: 30900

# Persistence for Portainer data
persistence:
  enabled: true
  size: 5Gi

# Ingress configuration (will work with Traefik)
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: portainer.localhost
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portainer-tls
      hosts:
        - portainer.localhost

# Image configuration
image:
  repository: portainer/portainer-ce
  tag: latest
  pullPolicy: Always

# Environment variables
env:
  - name: INIT_TIMEOUT
    value: "0"  # Disable security timeout

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
