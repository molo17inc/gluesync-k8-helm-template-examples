apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "gluesync.fullname" . }}-chronos-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-chronos-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.gluesyncChronos.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/api/`)
      kind: Rule
      priority: 5
      services:
        - name: {{ include "gluesync.fullname" . }}-chronos
          port: 1717
          scheme: https
          serversTransport: insecure-transport
  tls: {}
