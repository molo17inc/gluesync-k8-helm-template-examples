apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gluesync.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.grafana.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    com.molo17.conductor.type: module
spec:
  replicas: 1
  # Recreate: the RWO volume cannot follow a second pod started beside the old one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: {{ include "gluesync.image" (dict "ctx" . "kind" "Deployment" "name" (printf "%s-grafana" (include "gluesync.fullname" .)) "container" "grafana" "image" (.Values.grafana.image | default "grafana/grafana") "tag" .Values.grafana.tag) | quote }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "password"
            - name: GF_SERVER_ROOT_URL
              value: "https://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            # Dashboards and dashboard provider are baked into the molo17/grafana image
            {{- if and .Values.persistence.enabled .Values.persistence.grafana.enabled }}
            - name: grafana-storage
              mountPath: {{ .Values.persistence.grafana.mountPath | default "/var/lib/grafana" }}
            {{- else }}
            - name: grafana-data
              mountPath: /var/lib/grafana
            {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.grafana.limits.cpu }}
              memory: {{ .Values.resources.grafana.limits.memory }}
            requests:
              cpu: {{ .Values.resources.grafana.requests.cpu }}
              memory: {{ .Values.resources.grafana.requests.memory }}
      securityContext:
        fsGroup: 472  # Required for Grafana to write to the persistent volume
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        # Dashboards and dashboard provider are baked into the molo17/grafana image
        {{- if and .Values.persistence.enabled .Values.persistence.grafana.enabled }}
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: gluesync-grafana-data
        {{- else }}
        - name: grafana-data
          emptyDir: {}
        {{- end }}
