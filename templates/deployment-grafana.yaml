apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gluesync.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: "grafana/grafana:latest"
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "password"
            - name: GF_SERVER_ROOT_URL
              value: "https://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
              subPath: dashboard.yml
            - name: grafana-dashboard
              mountPath: /etc/grafana/provisioning/dashboards/core-hub-metrics.json
              subPath: core-hub-metrics.json
            {{- if and .Values.persistence.enabled .Values.persistence.grafana.enabled }}
            - name: grafana-storage
              mountPath: {{ .Values.persistence.grafana.mountPath | default "/var/lib/grafana" }}
            {{- else }}
            - name: grafana-data
              mountPath: /var/lib/grafana
            {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.grafana.limits.cpu }}
              memory: {{ .Values.resources.grafana.limits.memory }}
            requests:
              cpu: {{ .Values.resources.grafana.requests.cpu }}
              memory: {{ .Values.resources.grafana.requests.memory }}
      securityContext:
        fsGroup: 472  # Required for Grafana to write to the persistent volume
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboard
          configMap:
            name: grafana-dashboard
        {{- if and .Values.persistence.enabled .Values.persistence.grafana.enabled }}
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: gluesync-grafana-data
        {{- else }}
        - name: grafana-data
          emptyDir: {}
        {{- end }}
