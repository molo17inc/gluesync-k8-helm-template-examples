apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "gluesync.fullname" . }}-chronos
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-chronos
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.gluesyncChronos.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  stripPrefix:
    prefixes:
      - /chronos
