apiVersion: v1
kind: Service
metadata:
  name: {{ include "gluesync.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.grafana.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
