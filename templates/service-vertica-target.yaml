apiVersion: v1
kind: Service
metadata:
  name: {{ include "gluesync.fullname" . }}-vertica-target
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-vertica-target
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: port-1717
      protocol: TCP
      port: 1717
      targetPort: 1717
  selector:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-vertica-target
    app.kubernetes.io/instance: {{ .Release.Name }}
