apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.grafana.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "gluesync.fullname" . }}-prometheus:9090/prometheus
        isDefault: true
