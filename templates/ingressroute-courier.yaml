# Courier inbound endpoints: Traefik's `courier` entry point (HTTPS on 8090, see the deploy-*.sh
# Traefik install) forwards /api-inbound/ to Core Hub's own inbound server on port 8090.
# Since Core Hub 2.3.2.2 that server speaks HTTPS whenever Core Hub does, and this chart always runs
# Core Hub with TLS (SSL_ENABLED "true" in deployment-core-hub.yaml), so Traefik reaches it over
# HTTPS with the same insecure-transport as the Core Hub route (self-signed certificate).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "gluesync.fullname" . }}-courier
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-courier
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.gluesyncCoreHub.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  entryPoints:
    - courier
  routes:
    - match: PathPrefix(`/api-inbound/`)
      kind: Rule
      services:
        - name: {{ include "gluesync.fullname" . }}-core-hub
          port: 8090
          scheme: https
          serversTransport: insecure-transport
  tls: {}
