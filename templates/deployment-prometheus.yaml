apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gluesync.fullname" . }}-prometheus
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.prometheus.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    com.molo17.conductor.type: module
spec:
  replicas: 1
  # Recreate: the RWO volume cannot follow a second pod started beside the old one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gluesync.name" . }}-prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gluesync.name" . }}-prometheus
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: prometheus
          image: {{ include "gluesync.image" (dict "ctx" . "kind" "Deployment" "name" (printf "%s-prometheus" (include "gluesync.fullname" .)) "container" "prometheus" "image" (.Values.prometheus.image | default "prom/prometheus") "tag" .Values.prometheus.tag) | quote }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.external-url=/prometheus/"
            - "--web.route-prefix=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.persistence.prometheus.retention | default "30d" }}"
            - "--storage.tsdb.retention.size={{ .Values.persistence.prometheus.retentionSize | default "10GB" }}"
          ports:
            - containerPort: 9090
              protocol: TCP
              name: http
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            {{- if and .Values.persistence.enabled .Values.persistence.prometheus.enabled }}
            - name: prometheus-storage
              mountPath: /prometheus
            {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.prometheus.limits.cpu }}
              memory: {{ .Values.resources.prometheus.limits.memory }}
            requests:
              cpu: {{ .Values.resources.prometheus.requests.cpu }}
              memory: {{ .Values.resources.prometheus.requests.memory }}
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        {{- if and .Values.persistence.enabled .Values.persistence.prometheus.enabled }}
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: gluesync-prometheus-data
        {{- end }}
