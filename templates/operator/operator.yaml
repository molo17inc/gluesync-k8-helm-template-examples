{{- if .Values.operator.enabled }}
{{- $fullname := include "gluesync.fullname" . }}
{{- $op := printf "%s-operator" $fullname }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $op }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
# Namespaced: the Gluesync Kubernetes Operator (GKO) manages the Gluesync install of this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $op }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [gluesync.molo17.com]
    resources: [gluesyncplatforms]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [gluesync.molo17.com]
    resources: [gluesyncplatforms/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-shared" $fullname | quote }}]
    verbs: [get]
  # Disaster recovery (Core Hub UI, Settings, Disaster Recovery): the Secret with
  # the GS_DR_* variables, its backup, the Service of ports 1718 and 1719, and the
  # claim of the Chronos data. create cannot be limited to names.
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gko-disaster-recovery, gko-disaster-recovery-backup]
    verbs: [get, update, delete]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [gko-disaster-recovery]
    verbs: [get, update, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  # Courier inbound heal: GKO adds the port 8090 of Core Hub's Service and the
  # IngressRoute of /api-inbound/ to an install that lacks them (patches Traefik's
  # Deployment and Service with the rules above and these).
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, patch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list, watch, create]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # Leader election: during GKO's own update the old and the new pod run side by side.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $op }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $op }}
subjects:
  - kind: ServiceAccount
    name: {{ $op }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $op }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.operator.tag | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    # GKO finds its own Deployment by this label: it lists itself in the Core Hub
    # UI and updates itself last, after every other component.
    com.molo17.conductor.type: operator
spec:
  replicas: 1
  # GKO's own update: the new pod starts next to the old one, which keeps the
  # leader lease, and can put its own image back, until the new pod has been
  # Ready for minReadySeconds. A new GKO that never gets there is rolled back by
  # the old one; one that breaks later: kubectl rollout undo deployment/<name>.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  progressDeadlineSeconds: {{ .Values.operator.selfUpdate.progressDeadlineSeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $op }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gluesync-operator
          image: {{ include "gluesync.image" (dict "ctx" . "kind" "Deployment" "name" $op "container" "gluesync-operator" "image" .Values.operator.image "tag" .Values.operator.tag "newerTagWins" true) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --platform=gluesync
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --leader-elect
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # GKO's own update; env, not flags: an older GKO ignores them.
            - name: GKO_SELF_UPDATE
              value: {{ .Values.operator.selfUpdate.enabled | quote }}
            - name: GKO_SELF_UPDATE_DELAY
              value: "{{ .Values.operator.selfUpdate.delaySeconds }}s"
            - name: TZ
              value: "UTC"
          ports:
            - name: api
              containerPort: 1717
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ $fullname }}-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $op }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https-1717
      port: 1717
      targetPort: api
---
# The Core Hub UI reaches Conductor at /conductor/api, as in the Docker kit.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $op }}-conductor-api
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /conductor/api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $op }}-conductor-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/conductor/api`)
      kind: Rule
      priority: 20
      middlewares:
        - name: {{ $op }}-conductor-api
      services:
        - name: {{ $op }}
          port: 1717
          scheme: https
          serversTransport: insecure-transport
  tls: {}
---
{{- /* Keep the version the operator or the UI set since install: Helm never reverts an update. */ -}}
{{- $live := lookup "gluesync.molo17.com/v1alpha1" "GluesyncPlatform" .Release.Namespace "gluesync" -}}
{{- $version := toString .Values.gluesyncCoreHub.tag -}}
{{- $modules := dict -}}
{{- $requestID := "" -}}
{{- if $live -}}
{{- $version = default $version $live.spec.version -}}
{{- $modules = default (dict) $live.spec.modules -}}
{{- $requestID = default "" $live.spec.requestID -}}
{{- end }}
apiVersion: gluesync.molo17.com/v1alpha1
kind: GluesyncPlatform
metadata:
  name: gluesync
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  # No releaseChannel: the operator reads Core Hub's own setting.
  version: {{ $version | quote }}
  {{- with $modules }}
  modules: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $requestID }}
  requestID: {{ . | quote }}
  {{- end }}
  updatePolicy: {{ .Values.operator.updatePolicy }}
  stability: {{- toYaml .Values.operator.stability | nindent 4 }}
  maintenance: {{- toYaml .Values.operator.maintenance | nindent 4 }}
  coreHub:
    url: "https://{{ $fullname }}-core-hub:1717"
    insecureSkipVerify: true
    moduleAuth:
      licenseSecretRef:
        name: {{ $fullname }}-shared
        key: gs-license.dat
      tag: conductor
      advertisePort: 1717
      advertiseScheme: https
{{- end }}
