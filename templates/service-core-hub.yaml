apiVersion: v1
kind: Service
metadata:
  name: {{ include "gluesync.fullname" . }}-core-hub
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https-1717
      protocol: TCP
      port: 1717
      targetPort: 1717
    - name: http-8090
      protocol: TCP
      port: 8090
      targetPort: 8090
  selector:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-core-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
