apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: prometheus
        scheme: http
        metrics_path: "/prometheus/metrics"
        static_configs:
          - targets:
              - localhost:9090
      - job_name: 'gluesync-core-hub'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ['{{ include "gluesync.fullname" . }}-core-hub:1717']
