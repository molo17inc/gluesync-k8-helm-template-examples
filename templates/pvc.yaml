apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluesync-core-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: "standard"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluesync-mysql-cdc-source
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: "standard"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluesync-vertica-target
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  storageClassName: "standard"
---
