{{- if and .Values.persistence.enabled .Values.persistence.coreHub.enabled .Values.persistence.coreHub.data.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluesync-core-hub
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistence.coreHub.data.size | default "2Gi" }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.persistence.enabled .Values.persistence.sourceAgent.enabled .Values.persistence.sourceAgent.data.enabled (and .Values.gluesyncSourceAgent.name (ne .Values.gluesyncSourceAgent.name "")) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistence.sourceAgent.data.size | default "2Gi" }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}

