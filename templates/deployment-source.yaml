apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gluesync.fullname" . }}-{{ .Values.gluesyncSourceAgent.name }}-source-agent
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-{{ .Values.gluesyncSourceAgent.name }}-source-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gluesync.name" . }}-{{ .Values.gluesyncSourceAgent.name }}-source-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gluesync.name" . }}-{{ .Values.gluesyncSourceAgent.name }}-source-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent
          image: "{{ .Values.gluesyncSourceAgent.image }}:{{ .Chart.AppVersion }}"
          env:
            - name: type
              value: source
            - name: SSL_ENABLED
              value: "true" # set to true if you want to activate TLS encryption
            - name: GLUESYNC_HOST
              value: "{{ include "gluesync.fullname" . }}-core-hub"
          ports:
            - containerPort: 1717
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.resources.gluesyncSource.limits.cpu }}
              memory: {{ .Values.resources.gluesyncSource.limits.memory }}
            requests:
              cpu: {{ .Values.resources.gluesyncSource.requests.cpu }}
              memory: {{ .Values.resources.gluesyncSource.requests.memory }}
          volumeMounts:
            - name: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent
              mountPath: {{ .Values.persistence.sourceAgent.data.mountPath | default "/opt/gluesync/data" }}
            - name: gluesync-shared
              mountPath: /opt/gluesync/shared
            {{- if and .Values.persistence.enabled .Values.persistence.sourceAgent.enabled .Values.persistence.sourceAgent.logs.enabled }}
            - name: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent-logs
              mountPath: {{ .Values.persistence.sourceAgent.logs.mountPath | default "/opt/gluesync/logs" }}
            {{- end }}
      volumes:
        - name: gluesync-shared
          secret:
            secretName: {{ include "gluesync.fullname" . }}-shared
        - name: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent
          persistentVolumeClaim:
            claimName: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent
        {{- if and .Values.persistence.enabled .Values.persistence.sourceAgent.enabled .Values.persistence.sourceAgent.logs.enabled }}
        - name: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent-logs
          persistentVolumeClaim:
            claimName: gluesync-{{ .Values.gluesyncSourceAgent.name }}-source-agent-logs
        {{- end }}
