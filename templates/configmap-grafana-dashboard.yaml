apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  core-hub-metrics.json: |
{{ .Files.Get "dashboards/core-hub-metrics.json" | indent 4 }}
