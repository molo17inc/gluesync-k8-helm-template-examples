apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gluesync.fullname" . }}-shared
  labels:
    app.kubernetes.io/name: {{ include "gluesync.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.gluesyncCoreHub.tag }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  gluesync.com.jks: {{ .Values.secrets.jks | quote }}
  security-config.json: {{ .Values.secrets.securityConfig | b64enc | quote }}
  gs-license.dat: {{ .Values.secrets.license | b64enc | quote }}
  logback.xml: {{ .Values.secrets.logback | b64enc | quote }}
  gluesync-cert.pem: {{ .Values.secrets.cert | b64enc | quote }}
  gluesync-key.pem: {{ .Values.secrets.key | b64enc | quote }}
