replicaCount: 1

image:
  pullPolicy: Always

service:
  type: NodePort

gluesyncCoreHub:
  name: "core-hub"
  image: "molo17/gluesync-core-hub"
  tag: "latest" # Specify version tag here (e.g., "2.2.6.1" or "latest")

gluesyncChronos:
  name: "chronos"
  image: "molo17/gluesync-chronos"
  tag: "latest" # Specify version tag here (e.g., "0.0.xyz for its beta channel", "latest")

grafana:
  name: "grafana"
  image: "molo17/grafana"
  tag: "13.0.11.dashboard3" # never "latest": that tag is a Windows image and cannot start on Linux nodes

prometheus:
  name: "prometheus"
  image: "molo17/prometheus"
  tag: "3.15.1" # never "latest": that tag is a Windows image and cannot start on Linux nodes

# Global persistence settings (can be overridden per service)
persistence:
  enabled: true
  storageClass: "" # Set to your storage class or leave empty for default
  accessMode: ReadWriteOnce

  # Service-specific persistence configurations
  coreHub:
    enabled: true
    data:
      enabled: true
      size: 100Gi
      mountPath: /opt/gluesync/data
    logs:
      enabled: true
      size: 10Gi
      mountPath: /opt/gluesync/logs

  chronos:
    enabled: true
    data:
      enabled: true
      size: 1Gi
      mountPath: /app/data
    logs:
      enabled: true
      size: 2Gi
      mountPath: /app/logs

  prometheus:
    enabled: true
    size: 10Gi
    mountPath: /prometheus
    retention: 30d
    retentionSize: 10GB

  grafana:
    enabled: true
    size: 5Gi
    mountPath: /var/lib/grafana

# Resources (adjust based on your needs)
resources:
  gluesyncCoreHub:
    limits:
      cpu: "8"
      memory: "16Gi"
    requests:
      cpu: "4"
      memory: "8Gi"
  prometheus:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  grafana:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  gluesyncChronos:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

# Secrets - these should be provided during deployment
# You can override these with --set-file or by creating a secrets.yaml
secrets:
  jks: "" # Java KeyStore (base64 will be applied automatically)
  securityConfig: "" # security-config.json content
  license: "" # gs-license.dat content
  logback: "" # logback.xml content
  cert: "" # gluesync-cert.pem content
  key: "" # gluesync-key.pem content

# Gluesync Kubernetes Operator (GKO): updates Core Hub and the modules from the Core Hub
# UI (it takes Conductor's place on Kubernetes) or when spec.version of the GluesyncPlatform
# changes. Pipelines go into maintenance mode while Core Hub changes.
operator:
  enabled: true
  image: "molo17/gluesync-operator"
  tag: "latest" # pin a release for anything but a quick test (see README)
  updatePolicy: ui # ui | gitops (gitops: the UI cannot start updates; change spec.version in Git)
  # GKO's own update. GKO lists itself in the Core Hub UI and, when it is updated
  # (or Core Hub is, and GKO is not pinned), changes its own image last, once no
  # update has run for delaySeconds. Never with updatePolicy gitops: Git sets
  # operator.tag. enabled: false leaves GKO's image to helm upgrade.
  selfUpdate:
    enabled: true
    delaySeconds: 15
    # Kubernetes marks GKO's rollout failed after this; the old pod then rolls back.
    progressDeadlineSeconds: 300
  stability:
    windowSeconds: 20
    maxWaitSeconds: 180
  maintenance:
    disabled: false
    drainTimeoutSeconds: 600
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
      ephemeral-storage: "32Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
      ephemeral-storage: "256Mi" # container logs count against it
